aid: la-haus
name: La Haus
description: 'La Haus is a Latin American proptech company, founded in 2017 and headquartered
  in Medellín and Bogotá, Colombia, that operates the residential real-estate marketplaces
  lahaus.com (Colombia) and lahaus.mx (Mexico) together with an in-house brokerage.
  The platform lists de-duplicated, verified new-construction and resale housing from
  vetted developers, adds mortgage and down-payment simulators, buyer guides and an
  AI assistant, and takes buyers through negotiation and closing at no cost to the
  buyer. It has raised more than $135M in equity plus debt facilities from Kaszek,
  NFX, Acrew Capital, Greenspring Associates, SoftBank and Bezos Expeditions. La Haus
  publishes NO public developer portal, API documentation, SDK or machine-readable
  contract: the consumer sites are server-rendered applications whose /api/* paths
  are disallowed in robots.txt, and api.lahaus.com is a private AWS API Gateway that
  answers every anonymous request with MissingAuthenticationToken. Partner/portal syndication
  runs through access-controlled marketing feed integrations (Trovit). This profile
  therefore records the company''s public web surface and security posture rather than
  an API surface.'
